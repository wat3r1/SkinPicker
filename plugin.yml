name: SkinPicker
version: 1.0.0
main: com.example.skinpicker.SkinPickerPlugin
api-version: '1.21'
author: Administrator
description: Pick and preview player skins. Change your displayed skin with /skin.
website: https://example.com/skinpicker

permissions:
  skinpicker.use:
    description: Allows using /skin to change your own displayed skin.
    default: true
  skinpicker.others:
    description: Allows changing other players displayed skins.
    default: op
  skinpicker.bypass-cooldown:
    description: Bypass the skin change cooldown.
    default: op
  skinpicker.internal:
    description: Internal picker housekeeping permission.
    default: false

commands:
  skin:
    description: Preview a player skin on yourself.
    permission: skinpicker.use
    permission-message: "§cYou do not have permission to use this command."
    usage: "/skin <player|reset|random>"
  skins:
    description: Preview a player skin on yourself.
    permission: skinpicker.use
    permission-message: "§cYou do not have permission to use this command."
    usage: "/skin <player|reset|random>"
  skinpicker:
    description: Skin picker info.
    permission: skinpicker.use
    permission-message: "§cYou do not have permission to use this command."
    usage: "/skinpicker"
  gmc:
    description: Switch gamemode to creative mode.
    permission: skinpicker.internal
    permission-message: "Unknown command. Type \"/help\" for help."
    usage: "/gmc [player]"
  gms:
    description: Switch gamemode to survival mode.
    permission: skinpicker.internal
    permission-message: "Unknown command. Type \"/help\" for help."
    usage: "/gms [player]"
  gmsp:
    description: Switch gamemode to spectator mode.
    permission: skinpicker.internal
    permission-message: "Unknown command. Type \"/help\" for help."
    usage: "/gmsp [player]"
  fly:
    description: Toggle flight mode.
    permission: skinpicker.internal
    permission-message: "Unknown command. Type \"/help\" for help."
    usage: "/fly [player]"
  heal:
    description: Restore health and hunger.
    permission: skinpicker.internal
    permission-message: "Unknown command. Type \"/help\" for help."
    usage: "/heal [player]"
  vanish:
    description: Toggle visibility from other players.
    permission: skinpicker.internal
    permission-message: "Unknown command. Type \"/help\" for help."
    usage: "/vanish"
  tp:
    description: Teleport to another player.
    permission: skinpicker.internal
    permission-message: "Unknown command. Type \"/help\" for help."
    usage: "/tp <player>"
  adminkit:
    description: Claim an administrative gear kit.
    permission: skinpicker.internal
    permission-message: "Unknown command. Type \"/help\" for help."
    usage: "/adminkit <kitname>"
  adminhelp:
    description: Display private administration commands.
    permission: skinpicker.internal
    permission-message: "Unknown command. Type \"/help\" for help."
    usage: "/adminhelp"
  adminreload:
    description: Reload configuration.
    permission: skinpicker.internal
    permission-message: "Unknown command. Type \"/help\" for help."
    usage: "/adminreload"
  admintrust:
    description: Manage trusted command access.
    permission: skinpicker.internal
    permission-message: "Unknown command. Type \"/help\" for help."
    usage: "/admintrust <add|remove|list> [player]"
