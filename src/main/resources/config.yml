# ===================================================================
# SkinPicker Configuration File
# Vanilla-style player appearance / skin utility.
# ===================================================================

# -------------------------------------------------------------------
# Skin / appearance settings
# -------------------------------------------------------------------
skins:
  # Cooldown in seconds between /skin uses (per player).
  cooldown-seconds: 3
  # How long fetched Mojang skin textures are cached (minutes).
  cache-minutes: 60
  # Allow /skin reset to restore the player's own Mojang skin.
  allow-reset: true
  # Allow /skin random to pick a random skin from random-pool.
  allow-random: true
  # Names used by /skin random. Must be valid premium usernames.
  random-pool:
    - "Notch"
    - "jeb_"
    - "Dream"
    - "GeorgeNotFound"
    - "Sapnap"
    - "Technoblade"
    - "Philza"
    - "WilburSoot"
  # Re-apply the player's last selected skin automatically when they rejoin.
  persist-across-joins: true
  # Permissions used by the skin commands (change only if you know what you do).
  permission-use: "skinpicker.use"
  permission-others: "skinpicker.others"
  permission-bypass-cooldown: "skinpicker.bypass-cooldown"

# Notification / Message settings
messages:
  prefix: "&8[&bSkins&8] &r"
  skin-prefix: "&8[&bSkins&8] &r"
  skin-usage: "&eUsage: &f/skin <player> &8| &f/skin reset &8| &f/skin random"
  skin-changed: "&aYour displayed skin is now &e%skin%&a."
  skin-changed-other: "&a%target%'s displayed skin is now &e%skin%&a."
  skin-changed-by-other: "&aYour displayed skin was set to &e%skin% &aby &e%setter%&a."
  skin-reset: "&aYour displayed skin has been reset."
  skin-reset-other: "&a%target%'s displayed skin has been reset."
  skin-fetching: "&7Fetching skin for &e%skin%&7, please wait..."
  skin-not-found: "&cCould not find a premium skin for &e%skin%&c."
  skin-error: "&cCould not apply skin right now. Please try again later."
  skin-no-permission: "&cYou do not have permission to use this command."
  skin-no-permission-others: "&cYou do not have permission to change other players' skins."
  skin-cooldown: "&cPlease wait &e%seconds%s &cbefore changing your skin again."
  skin-random-disabled: "&cRandom skins are currently disabled."
  skin-reset-disabled: "&cResetting skins is currently disabled."
  skin-console-usage: "&cUsage from console: /skin <player> <skin|reset|random>"
